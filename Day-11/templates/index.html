<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student Score Prediction</title>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>
    <div class="container">
      <div class="card">
        <h1>Student Score Prediction</h1>

        <p class="subtitle">
          Predict a student's score from hours studied, attendance, and previous
          score
        </p>

        <form method="POST">
          <label for="hours"> Study Hours </label>

          <input
            type="number"
            id="hours"
            name="hours"
            step="0.1"
            min="0"
            placeholder="Enter study hours"
            required
          />

          <label for="attendance"> Attendance (%) </label>

          <input
            type="number"
            id="attendance"
            name="attendance"
            step="0.1"
            min="0"
            max="100"
            placeholder="Enter attendance percentage"
            required
          />

          <label for="previous_score"> Previous Score </label>

          <input
            type="number"
            id="previous_score"
            name="previous_score"
            step="0.1"
            min="0"
            max="100"
            placeholder="Enter previous score"
            required
          />

          <button type="submit">Predict Score</button>
        </form>

        {% if prediction is not none %}

        <div class="result">
          <h2>Predicted Score</h2>

          <p>{{ prediction }}</p>

          <span>marks</span>
        </div>

        {% endif %}
      </div>
    </div>
  </body>
</html>
